<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103d32">
<meta name="description" content="Discover Faaroa River in Raiatea with WaiLusi. Guided kayaking, tropical plants, river stories, botanical garden, fruit tasting and coconut demonstration.">
<title>WaiLusi Raiatea | Faaroa River Kayak Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#103d32;--green2:#285b4b;--cream:#f8f6ef;--sand:#e8dfce;--gold:#c99d50;--dark:#202c27;--muted:#68756d;--white:#fff;--radius:18px;--shadow:0 12px 35px rgba(20,45,35,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--cream);line-height:1.7}
img{display:block;max-width:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,90%);margin:auto}
.section{padding:84px 0}
.eyebrow{text-transform:uppercase;letter-spacing:3px;color:var(--gold);font-size:.75rem;font-weight:700}
h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.2}
h2{font-size:clamp(2rem,4vw,3.1rem);color:var(--green);margin:12px 0 18px}
.section-intro{max-width:700px;color:var(--muted);margin-bottom:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 25px;border-radius:50px;font-weight:700;border:1px solid transparent;transition:.2s}
.btn-primary{background:var(--gold);color:#182b23}
.btn-primary:hover{background:#d8b46f;transform:translateY(-2px)}
.btn-outline{border-color:rgba(255,255,255,.85);color:#fff}
.btn-outline:hover{background:#fff;color:var(--green)}
.btn-dark{background:var(--green);color:#fff}
.btn-dark:hover{background:var(--green2)}
/* Header and large primary logo */
header{position:sticky;top:0;z-index:100;background:rgba(248,246,239,.97);backdrop-filter:blur(12px);box-shadow:0 2px 15px rgba(0,0,0,.06)}
.navbar{min-height:0;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.brand{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:100%}
.brand-logo{display:block;width:250px;height:auto;max-height:190px;object-fit:contain;margin:0 auto}
.nav-links{display:flex;align-items:center;gap:20px;font-size:.88rem;font-weight:600}
.nav-links a:hover{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:12px}
.language{border:1px solid var(--sand);background:transparent;padding:8px 12px;border-radius:30px;color:var(--green);font-weight:700}
.menu-toggle{display:none;background:none;border:0;color:var(--green);font-size:1.8rem}
